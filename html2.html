<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Project Showcase</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: #09090b;
            color: #fff;
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden; /* Scrollbar hide karne ke liye */
        }

        .header {
            text-align: center;
            margin-top: 40px;
            z-index: 10;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .header p {
            font-size: 16px;
            color: #a1a1aa;
            font-weight: 400;
        }

        /* Slider Container */
        .slider-container {
            width: 100%;
            height: 60vh;
            display: flex;
            align-items: center;
            overflow: hidden;
            position: relative;
            margin-top: 20px;
        }

        /* The line track */
        .slider-track {
            display: flex;
            gap: 30px;
            padding: 0 50vw; /* Shuru mein center karne ke liye padding */
            transition: transform 0.8s ease-in-out;
            will-change: transform;
        }

        /* Image Cards */
        .slide-card {
            width: 260px;
            height: 360px;
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
            background: #18181b;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.4s ease;
            border: 2px solid transparent;
        }

        .slide-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Center image highlight */
        .slide-card.active {
            border-color: #3b82f6;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.4);
            transform: scale(1.05); /* Center wali thodi badi */
        }

        /* Progress Dots */
        .progress-container {
            position: absolute;
            bottom: 30px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        .dot.active {
            background: #3b82f6;
            width: 24px;
            border-radius: 4px;
            box-shadow: 0 0 10px #3b82f6;
        }

        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #3b82f6;
            font-size: 18px;
            font-weight: 600;
            z-index: 20;
        }

        @media (max-width: 768px) {
            .slide-card { width: 220px; height: 320px; }
            .header h1 { font-size: 26px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Project Showcases</h1>
        <p id="subtitle">Loading Gallery...</p>
    </div>

    <div id="loader">Fetching Images...</div>

    <div class="slider-container" id="sliderContainer">
        <div class="slider-track" id="sliderTrack"></div>
        <div class="progress-container" id="progress"></div>
    </div>

    <script>
        let images = [];
        let currentIndex = 0;
        let autoPlayInterval = null;
        
        const SLIDE_TIME = 3000; // Har 3 second mein agli image

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initSlider() {
            const track = document.getElementById('sliderTrack');
            const progress = document.getElementById('progress');
            track.innerHTML = '';
            progress.innerHTML = '';

            images.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'slide-card' + (index === 0 ? ' active' : '');
                card.innerHTML = `<img src="${item.url}" alt="Project Image">`;
                track.appendChild(card);

                const dot = document.createElement('div');
                dot.className = 'dot' + (index === 0 ? ' active' : '');
                progress.appendChild(dot);
            });

            // Shuru mein pehli image center karne ke liye thoda delay
            setTimeout(() => moveToSlide(0), 100);
            startAutoPlay();
        }

        function moveToSlide(index) {
            const track = document.getElementById('sliderTrack');
            const cards = document.querySelectorAll('.slide-card');
            const dots = document.querySelectorAll('.dot');
            const container = document.getElementById('sliderContainer');

            if (cards.length === 0) return;

            // Highlight update
            cards.forEach(c => c.classList.remove('active'));
            dots.forEach(d => d.classList.remove('active'));
            cards[index].classList.add('active');
            dots[index].classList.add('active');

            // Position calculation (Bilkul straight line center)
            const cardWidth = cards[index].offsetWidth;
            const gap = 30; 
            const containerWidth = container.offsetWidth;
            
            const offset = (cardWidth + gap) * index;
            const centerOffset = (containerWidth / 2) - (cardWidth / 2);
            
            track.style.transform = `translateX(${centerOffset - offset}px)`;
            
            currentIndex = index;
        }

        function startAutoPlay() {
            if (autoPlayInterval) clearInterval(autoPlayInterval);
            autoPlayInterval = setInterval(() => {
                let nextIndex = currentIndex + 1;
                // Agar end par pohanch jaye toh wapis shuru se chalu ho
                if (nextIndex >= images.length) {
                    nextIndex = 0; 
                }
                moveToSlide(nextIndex);
            }, SLIDE_TIME);
        }

        async function loadImages() {
            try {
                const response = await fetch('/api/list');
                const contentType = response.headers.get("content-type");
                
                if (!contentType || !contentType.includes("application/json")) {
                    throw new Error("Server did not return JSON.");
                }

                const data = await response.json();
                const loader = document.getElementById('loader');
                const subtitle = document.getElementById('subtitle');

                loader.style.display = 'none';

                if (data.length === 0) {
                    subtitle.innerText = "No images found.";
                    return;
                }

                images = shuffle(data);
                subtitle.innerText = `Line Scrolling (${images.length} Images)`;

                initSlider();

            } catch (error) {
                document.getElementById('loader').innerHTML = `<span style="color:#ef4444;">Error: ${error.message}</span>`;
            }
        }

        // Hover karne par pause ho jaye
        document.getElementById('sliderContainer').addEventListener('mouseenter', () => {
            clearInterval(autoPlayInterval);
        });
        
        document.getElementById('sliderContainer').addEventListener('mouseleave', () => {
            startAutoPlay();
        });

        window.onload = loadImages;
    </script>
</body>
</html>
