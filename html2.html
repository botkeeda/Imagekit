<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Project Showcase</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: #09090b;
            color: #fff;
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-top: 40px;
            z-index: 10;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .header p {
            font-size: 16px;
            color: #a1a1aa;
            font-weight: 400;
        }

        .scene {
            width: 100%;
            height: 60vh;
            margin-top: 50px;
            perspective: 1200px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .carousel {
            width: 200px;
            height: 280px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-10deg);
        }

        /* Random 3D animation classes — JS will pick one each reload */
        .anim-rotate360 {
            animation: rotate360 30s infinite linear;
        }
        .anim-tilt-flip {
            animation: tiltFlip 28s infinite linear;
        }
        .anim-wave-spin {
            animation: waveSpin 32s infinite linear;
        }
        .anim-pulse-rotate {
            animation: pulseRotate 26s infinite ease-in-out;
        }
        .anim-float-spin {
            animation: floatSpin 34s infinite linear;
        }
        .anim-orbit {
            animation: orbitSpin 30s infinite linear;
        }
        .anim-twist {
            animation: twistSpin 29s infinite linear;
        }
        .anim-helix {
            animation: helixSpin 33s infinite linear;
        }

        .scene:hover .carousel {
            animation-play-state: paused;
        }

        @keyframes rotate360 {
            from { transform: rotateX(-10deg) rotateY(0deg); }
            to { transform: rotateX(-10deg) rotateY(-360deg); }
        }

        @keyframes tiltFlip {
            0%   { transform: rotateX(-20deg) rotateY(0deg); }
            50%  { transform: rotateX(20deg) rotateY(-180deg); }
            100% { transform: rotateX(-20deg) rotateY(-360deg); }
        }

        @keyframes waveSpin {
            0%   { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            25%  { transform: rotateX(15deg) rotateY(-90deg) rotateZ(10deg); }
            50%  { transform: rotateX(0deg) rotateY(-180deg) rotateZ(0deg); }
            75%  { transform: rotateX(-15deg) rotateY(-270deg) rotateZ(-10deg); }
            100% { transform: rotateX(0deg) rotateY(-360deg) rotateZ(0deg); }
        }

        @keyframes pulseRotate {
            0%   { transform: rotateX(-10deg) rotateY(0deg) scale(1); }
            50%  { transform: rotateX(-10deg) rotateY(-180deg) scale(1.15); }
            100% { transform: rotateX(-10deg) rotateY(-360deg) scale(1); }
        }

        @keyframes floatSpin {
            0%   { transform: rotateX(-8deg) rotateY(0deg) translateY(0px); }
            25%  { transform: rotateX(-8deg) rotateY(-90deg) translateY(-20px); }
            50%  { transform: rotateX(-8deg) rotateY(-180deg) translateY(0px); }
            75%  { transform: rotateX(-8deg) rotateY(-270deg) translateY(20px); }
            100% { transform: rotateX(-8deg) rotateY(-360deg) translateY(0px); }
        }

        @keyframes orbitSpin {
            0%   { transform: rotateX(-15deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: rotateX(-15deg) rotateY(-360deg) rotateZ(-30deg); }
        }

        @keyframes twistSpin {
            0%   { transform: rotateX(-10deg) rotateY(0deg) rotateZ(0deg); }
            50%  { transform: rotateX(10deg) rotateY(-180deg) rotateZ(180deg); }
            100% { transform: rotateX(-10deg) rotateY(-360deg) rotateZ(360deg); }
        }

        @keyframes helixSpin {
            0%   { transform: rotateX(-5deg) rotateY(0deg) skewX(0deg); }
            25%  { transform: rotateX(-5deg) rotateY(-90deg) skewX(5deg); }
            50%  { transform: rotateX(-5deg) rotateY(-180deg) skewX(0deg); }
            75%  { transform: rotateX(-5deg) rotateY(-270deg) skewX(-5deg); }
            100% { transform: rotateX(-5deg) rotateY(-360deg) skewX(0deg); }
        }

        .carousel-card {
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: #18181b;
            transition: border-color 0.3s;
        }

        .carousel-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
            transition: opacity 0.3s, transform 0.3s;
        }

        .carousel-card:hover {
            border-color: #3b82f6;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.5);
        }

        .carousel-card:hover img {
            opacity: 1;
            transform: scale(1.05);
        }

        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #3b82f6;
            font-size: 18px;
            font-weight: 600;
            z-index: 20;
        }

    </style>
</head>
<body>

    <div class="header">
        <h1>Project Showcases</h1>
        <p id="subtitle">Loading Gallery...</p>
    </div>

    <div id="loader">Fetching Images...</div>

    <div class="scene">
        <div class="carousel" id="carousel">
        </div>
    </div>

    <script>
        // Random 3D animation picker — different every page reload
        const animations = [
            'anim-rotate360',
            'anim-tilt-flip',
            'anim-wave-spin',
            'anim-pulse-rotate',
            'anim-float-spin',
            'anim-orbit',
            'anim-twist',
            'anim-helix'
        ];

        function applyRandomAnimation() {
            const carousel = document.getElementById('carousel');
            const randomAnim = animations[Math.floor(Math.random() * animations.length)];
            carousel.classList.add(randomAnim);
        }

        async function loadImages() {
            try {
                const response = await fetch('/api/list');
                
                const contentType = response.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    throw new Error("Server did not return JSON.");
                }

                const data = await response.json();
                const carousel = document.getElementById('carousel');
                const loader = document.getElementById('loader');
                const subtitle = document.getElementById('subtitle');

                loader.style.display = 'none';

                if (data.length === 0) {
                    subtitle.innerText = "No images found.";
                    return;
                }

                subtitle.innerText = `Rotating 3D Preview (${data.length} Images)`;

                const totalItems = data.length;
                const cardWidth = 200;
                
                let radius = (cardWidth / 2) / Math.tan(Math.PI / totalItems);
                if (totalItems < 4) radius = 300;

                const angleStep = 360 / totalItems;

                data.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = 'carousel-card';
                    
                    const angle = index * angleStep;
                    card.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;

                    card.innerHTML = `
                        <img src="${item.url}" alt="Image" loading="lazy">
                    `;
                    carousel.appendChild(card);
                });

                // Apply random 3D animation after cards are built
                applyRandomAnimation();

            } catch (error) {
                document.getElementById('loader').innerHTML = `<span style="color:#ef4444;">Error: ${error.message}</span>`;
            }
        }

        window.onload = function() {
            loadImages();
        };
    </script>
</body>
</html>
