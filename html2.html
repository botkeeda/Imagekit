<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Showcase</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: #09090b;
            color: #fff;
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden; /* Hide scrollbars */
        }

        /* Header styling */
        .header {
            text-align: center;
            margin-top: 40px;
            z-index: 10;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .header p {
            font-size: 16px;
            color: #a1a1aa;
            font-weight: 400;
        }

        /* Live Button at bottom */
        .live-badge {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #e2e8f0;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #3b82f6; /* Blue dot */
            border-radius: 50%;
            box-shadow: 0 0 10px #3b82f6;
        }

        /* --- SLIDER CSS (No 3D) --- */
        .slider-container {
            width: 100%;
            height: 60vh;
            margin-top: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            width: 260px; /* Image size */
            height: 360px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: #18181b;
            
            /* Animation for fade in and out */
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
            pointer-events: none; /* Click through disabled when hidden */
        }

        /* Active Slide Style */
        .slide.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto; 
            z-index: 5;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Loader */
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #3b82f6;
            font-size: 18px;
            font-weight: 600;
            z-index: 20;
        }

    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <h1>Project Showcases</h1>
        <p id="subtitle">Loading Gallery...</p>
    </div>

    <!-- Loader -->
    <div id="loader">Fetching Images...</div>

    <!-- Slider Area -->
    <div class="slider-container" id="slider">
        <!-- Images will be injected here -->
    </div>

    <!-- Live Button -->
    <div class="live-badge">
        <div class="live-dot"></div>
        LIVE
    </div>

    <script>
        let allImages = [];
        let currentIndex = 0;
        let slideInterval;

        async function loadImages() {
            try {
                const response = await fetch('/api/list');
                
                const contentType = response.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    throw new Error("Server did not return JSON.");
                }

                const data = await response.json();
                const slider = document.getElementById('slider');
                const loader = document.getElementById('loader');
                const subtitle = document.getElementById('subtitle');

                loader.style.display = 'none'; // Hide loader

                if (!data || data.length === 0) {
                    subtitle.innerText = "No images found.";
                    return;
                }

                allImages = data;
                
                // Update subtitle count
                subtitle.innerText = `Showing (${data.length} Images)`;

                // Create slides for all images
                data.forEach((item, index) => {
                    const div = document.createElement('div');
                    // First image will be active initially
                    div.className = `slide ${index === 0 ? 'active' : ''}`;
                    
                    div.innerHTML = `
                        <img src="${item.url}" alt="Image" loading="lazy">
                    `;
                    slider.appendChild(div);
                });

                // Start the auto-slide
                startSlider();

            } catch (error) {
                document.getElementById('loader').innerHTML = `<span style="color:#ef4444;">Error: ${error.message}</span>`;
            }
        }

        function startSlider() {
            const slides = document.querySelectorAll('.slide');
            if (slides.length === 0) return;

            // Clear any existing interval
            clearInterval(slideInterval);

            // Change image every 3 seconds (3000ms)
            slideInterval = setInterval(() => {
                // Remove active class from current
                slides[currentIndex].classList.remove('active');
                
                // Move to next image (loop back to 0 if at end)
                currentIndex = (currentIndex + 1) % slides.length;
                
                // Add active class to next
                slides[currentIndex].classList.add('active');
            }, 3000); 
        }

        window.onload = function() {
            loadImages();
        };
    </script>
</body>
</html>
