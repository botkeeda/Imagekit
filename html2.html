<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Project Showcase</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: radial-gradient(circle at center, #1a1a20 0%, #09090b 100%);
            color: #fff;
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-top: 40px;
            z-index: 10;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .header p {
            font-size: 16px;
            color: #a1a1aa;
            font-weight: 400;
        }

        /* Container for the straight line slider */
        .slider-container {
            width: 100%;
            max-width: 1200px;
            height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
            overflow: hidden;
            position: relative;
            margin-top: 20px;
        }

        /* The track that moves left to right */
        .slider-track {
            display: flex;
            gap: 30px; /* Space between images */
            padding: 20px;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }

        /* Individual Image Card */
        .slide-card {
            width: 280px;
            height: 380px;
            border-radius: 16px;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 
                        0 0 0 1px rgba(255, 255, 255, 0.1);
            background: #18181b;
            transition: all 0.4s ease;
            position: relative;
        }

        .slide-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        /* Premium glowing effect on the center/active card */
        .slide-card.active {
            transform: scale(1.05) translateZ(20px);
            box-shadow: 0 20px 50px rgba(59, 130, 246, 0.3), 
                        0 0 0 2px rgba(59, 130, 246, 0.5);
            z-index: 2;
        }

        .slide-card.active img {
            opacity: 1;
            transform: scale(1.02);
        }

        /* Dark gradient overlay for depth */
        .slide-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            opacity: 0.6;
        }

        .slide-card.active::after {
            opacity: 0.3;
        }

        /* Progress dots at the bottom */
        .progress-container {
            position: absolute;
            bottom: 30px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.4s ease;
        }
        .dot.active {
            background: #3b82f6;
            box-shadow: 0 0 10px #3b82f6;
            width: 24px;
            border-radius: 4px;
        }

        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #3b82f6;
            font-size: 18px;
            font-weight: 600;
            z-index: 20;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .slide-card { width: 240px; height: 340px; }
            .header h1 { font-size: 26px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Project Showcases</h1>
        <p id="subtitle">Loading Gallery...</p>
    </div>

    <div id="loader">Fetching Images...</div>

    <div class="slider-container" id="sliderContainer">
        <div class="slider-track" id="sliderTrack"></div>
        <div class="progress-container" id="progress"></div>
    </div>

    <script>
        let images = [];
        let currentIndex = 0;
        let autoPlayInterval = null;
        
        const SLIDE_TIME = 3000; // 3 seconds per slide

        // Shuffle array for random order
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Build UI
        function initSlider() {
            const track = document.getElementById('sliderTrack');
            const progress = document.getElementById('progress');
            track.innerHTML = '';
            progress.innerHTML = '';

            images.forEach((item, index) => {
                // Create Card
                const card = document.createElement('div');
                card.className = 'slide-card' + (index === 0 ? ' active' : '');
                card.innerHTML = `<img src="${item.url}" alt="Project Image">`;
                track.appendChild(card);

                // Create Dot
                const dot = document.createElement('div');
                dot.className = 'dot' + (index === 0 ? ' active' : '');
                progress.appendChild(dot);
            });

            moveToSlide(0);
            startAutoPlay();
        }

        // Function to calculate movement and slide
        function moveToSlide(index) {
            const track = document.getElementById('sliderTrack');
            const cards = document.querySelectorAll('.slide-card');
            const dots = document.querySelectorAll('.dot');
            const container = document.getElementById('sliderContainer');

            if (cards.length === 0) return;

            // Remove active classes
            cards.forEach(c => c.classList.remove('active'));
            dots.forEach(d => d.classList.remove('active'));

            // Add active class to current
            cards[index].classList.add('active');
            dots[index].classList.add('active');

            // Calculate exact center position for the active card
            const cardWidth = cards[index].offsetWidth;
            const gap = 30; // match CSS gap
            const containerWidth = container.offsetWidth;
            
            // Math to keep the active card dead center
            const offset = (cardWidth + gap) * index;
            const centerOffset = (containerWidth / 2) - (cardWidth / 2);
            
            track.style.transform = `translateX(${centerOffset - offset}px)`;
            
            currentIndex = index;
        }

        // Auto Play Logic
        function startAutoPlay() {
            if (autoPlayInterval) clearInterval(autoPlayInterval);
            autoPlayInterval = setInterval(() => {
                let nextIndex = currentIndex + 1;
                if (nextIndex >= images.length) {
                    nextIndex = 0; // Loop back to start
                }
                moveToSlide(nextIndex);
            }, SLIDE_TIME);
        }

        // Fetch Data
        async function loadImages() {
            try {
                const response = await fetch('/api/list');
                const contentType = response.headers.get("content-type");
                
                if (!contentType || !contentType.includes("application/json")) {
                    throw new Error("Server did not return JSON.");
                }

                const data = await response.json();
                const loader = document.getElementById('loader');
                const subtitle = document.getElementById('subtitle');

                loader.style.display = 'none';

                if (data.length === 0) {
                    subtitle.innerText = "No images found.";
                    return;
                }

                images = shuffle(data);
                subtitle.innerText = `Smooth Line Showcase (${images.length} Images)`;

                initSlider();

            } catch (error) {
                document.getElementById('loader').innerHTML = `<span style="color:#ef4444;">Error: ${error.message}</span>`;
            }
        }

        // Pause auto-play on hover (Premium touch)
        document.getElementById('sliderContainer').addEventListener('mouseenter', () => {
            clearInterval(autoPlayInterval);
        });
        
        document.getElementById('sliderContainer').addEventListener('mouseleave', () => {
            startAutoPlay();
        });

        window.onload = loadImages;
    </script>
</body>
</html>
