<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Project Showcase</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: radial-gradient(circle at 50% 40%, #131318 0%, #09090b 70%);
            color: #fff;
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-top: 40px;
            z-index: 10;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .header p {
            font-size: 16px;
            color: #a1a1aa;
            font-weight: 400;
        }

        .scene {
            width: 100%;
            flex: 1;
            perspective: 1400px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .stage {
            position: relative;
            width: 320px;
            height: 440px;
            transform-style: preserve-3d;
        }

        .showcase-card {
            position: absolute;
            inset: 0;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75),
                        0 0 0 1px rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: #18181b;
            opacity: 0;
            transform-style: preserve-3d;
            backface-visibility: hidden;
            will-change: transform, opacity;
        }

        .showcase-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .showcase-card .glow {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,0.55) 100%);
            pointer-events: none;
        }

        /* ============ ENTRY ANIMATIONS (random per image) ============ */

        /* 1. Flip in from left */
        .in-flip-left {
            animation: inFlipLeft 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes inFlipLeft {
            0%   { opacity: 0; transform: translateX(-120%) rotateY(90deg) scale(0.7); }
            100% { opacity: 1; transform: translateX(0) rotateY(0deg) scale(1); }
        }

        /* 2. Flip in from right */
        .in-flip-right {
            animation: inFlipRight 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes inFlipRight {
            0%   { opacity: 0; transform: translateX(120%) rotateY(-90deg) scale(0.7); }
            100% { opacity: 1; transform: translateX(0) rotateY(0deg) scale(1); }
        }

        /* 3. Rise up + tilt */
        .in-rise {
            animation: inRise 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes inRise {
            0%   { opacity: 0; transform: translateY(140px) rotateX(45deg) scale(0.8); }
            100% { opacity: 1; transform: translateY(0) rotateX(0deg) scale(1); }
        }

        /* 4. Zoom spin */
        .in-zoom-spin {
            animation: inZoomSpin 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes inZoomSpin {
            0%   { opacity: 0; transform: scale(0.2) rotateZ(-35deg) rotateY(60deg); }
            100% { opacity: 1; transform: scale(1) rotateZ(0deg) rotateY(0deg); }
        }

        /* 5. Drop from top */
        .in-drop {
            animation: inDrop 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes inDrop {
            0%   { opacity: 0; transform: translateY(-160px) rotateX(-70deg); }
            100% { opacity: 1; transform: translateY(0) rotateX(0deg); }
        }

        /* 6. Swing in */
        .in-swing {
            animation: inSwing 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes inSwing {
            0%   { opacity: 0; transform: rotateZ(-25deg) rotateY(70deg) scale(0.6); transform-origin: top center; }
            100% { opacity: 1; transform: rotateZ(0deg) rotateY(0deg) scale(1); transform-origin: top center; }
        }

        /* 7. Depth push */
        .in-depth {
            animation: inDepth 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes inDepth {
            0%   { opacity: 0; transform: translateZ(-900px) rotateY(30deg); }
            100% { opacity: 1; transform: translateZ(0) rotateY(0deg); }
        }

        /* 8. Skew reveal */
        .in-skew {
            animation: inSkew 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes inSkew {
            0%   { opacity: 0; transform: translateX(80px) skewX(25deg) rotateY(-40deg) scale(0.85); }
            100% { opacity: 1; transform: translateX(0) skewX(0deg) rotateY(0deg) scale(1); }
        }

        /* ============ EXIT ANIMATIONS ============ */
        .out-fade {
            animation: outFade 0.55s ease forwards;
        }
        @keyframes outFade {
            from { opacity: 1; transform: scale(1) rotateY(0deg); }
            to   { opacity: 0; transform: scale(0.85) rotateY(35deg); }
        }

        /* subtle idle floating for premium feel */
        .idle-float {
            animation: idleFloat 4s ease-in-out infinite;
        }
        @keyframes idleFloat {
            0%, 100% { transform: translateY(0) rotateX(0deg); }
            50%      { transform: translateY(-12px) rotateX(2deg); }
        }

        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #3b82f6;
            font-size: 18px;
            font-weight: 600;
            z-index: 20;
        }

        .progress {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: all 0.4s;
        }
        .dot.active {
            background: #3b82f6;
            box-shadow: 0 0 12px #3b82f6;
            width: 26px;
            border-radius: 6px;
        }

    </style>
</head>
<body>

    <div class="header">
        <h1>Project Showcases</h1>
        <p id="subtitle">Loading Gallery...</p>
    </div>

    <div id="loader">Fetching Images...</div>

    <div class="scene">
        <div class="stage" id="stage"></div>
        <div class="progress" id="progress"></div>
    </div>

    <script>
        const entryAnimations = [
            'in-flip-left',
            'in-flip-right',
            'in-rise',
            'in-zoom-spin',
            'in-drop',
            'in-swing',
            'in-depth',
            'in-skew'
        ];

        let images = [];
        let current = 0;
        let timer = null;
        const SLIDE_TIME = 3200;      // time each image stays
        const EXIT_TIME = 550;        // exit anim duration

        function shuffle(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function buildDots(total) {
            const progress = document.getElementById('progress');
            progress.innerHTML = '';
            for (let i = 0; i < total; i++) {
                const d = document.createElement('div');
                d.className = 'dot' + (i === 0 ? ' active' : '');
                progress.appendChild(d);
            }
        }

        function updateDots(idx) {
            document.querySelectorAll('.dot').forEach((d, i) => {
                d.classList.toggle('active', i === idx);
            });
        }

        function showNext() {
            const stage = document.getElementById('stage');
            const oldCard = stage.querySelector('.showcase-card');
            const animClass = entryAnimations[Math.floor(Math.random() * entryAnimations.length)];

            const item = images[current];

            // Build new card
            const card = document.createElement('div');
            card.className = 'showcase-card ' + animClass;
            card.innerHTML = `
                <img src="${item.url}" alt="Project">
                <div class="glow"></div>
            `;
            stage.appendChild(card);

            // Remove exit of old card
            if (oldCard) {
                oldCard.classList.remove(...entryAnimations);
                oldCard.classList.add('out-fade');
                setTimeout(() => oldCard.remove(), EXIT_TIME);
            }

            // After entry animation, add subtle idle float
            setTimeout(() => {
                card.classList.remove(animClass);
                card.style.opacity = '1';
                card.style.transform = 'none';
                card.classList.add('idle-float');
            }, 1050);

            updateDots(current);

            current = (current + 1) % images.length;
        }

        function startLoop() {
            showNext();
            timer = setInterval(showNext, SLIDE_TIME);
        }

        async function loadImages() {
            try {
                const response = await fetch('/api/list');
                const contentType = response.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    throw new Error("Server did not return JSON.");
                }

                const data = await response.json();
                const loader = document.getElementById('loader');
                const subtitle = document.getElementById('subtitle');

                loader.style.display = 'none';

                if (!data || data.length === 0) {
                    subtitle.innerText = "No images found.";
                    return;
                }

                images = shuffle(data);   // random order each load
                subtitle.innerText = `Cinematic 3D Showcase (${images.length} Images)`;

                buildDots(images.length);
                startLoop();

            } catch (error) {
                document.getElementById('loader').innerHTML =
                    `<span style="color:#ef4444;">Error: ${error.message}</span>`;
            }
        }

        window.onload = loadImages;
    </script>
</body>
</html>
