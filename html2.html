<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Project Showcase</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: radial-gradient(circle at center, #1a1a20 0%, #09090b 100%);
            color: #fff;
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-top: 40px;
            z-index: 10;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .header p {
            font-size: 16px;
            color: #a1a1aa;
            font-weight: 400;
        }

        .scene {
            width: 100%;
            height: 65vh;
            perspective: 1200px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-top: 20px;
        }

        .tv-card {
            position: absolute;
            width: 260px;
            height: 360px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9),
                        0 0 0 1px rgba(255, 255, 255, 0.1);
            background: #18181b;
            opacity: 0;
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }

        .tv-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.95;
            transition: opacity 0.3s;
        }

        .tv-card::after {
            content: '';
            position: absolute;
            inset: 0;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        /* =========================================
           1 BY 1 RANDOM 3D EFFECTS (TV Screensaver style)
           ========================================= */

        /* 1. Fly in from deep space */
        .effect-zoom-in {
            animation: zoomIn 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes zoomIn {
            0% { opacity: 0; transform: translateZ(-1500px) scale(0.1); }
            100% { opacity: 1; transform: translateZ(0) scale(1); }
        }

        /* 2. 3D Flip Left */
        .effect-flip-left {
            animation: flipLeft 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes flipLeft {
            0% { opacity: 0; transform: translateX(-100%) rotateY(90deg); }
            100% { opacity: 1; transform: translateX(0) rotateY(0deg); }
        }

        /* 3. 3D Flip Right */
        .effect-flip-right {
            animation: flipRight 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes flipRight {
            0% { opacity: 0; transform: translateX(100%) rotateY(-90deg); }
            100% { opacity: 1; transform: translateX(0) rotateY(0deg); }
        }

        /* 4. Rise and Tilt */
        .effect-rise {
            animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes rise {
            0% { opacity: 0; transform: translateY(100%) rotateX(-60deg) scale(0.8); }
            100% { opacity: 1; transform: translateY(0) rotateX(0deg) scale(1); }
        }

        /* 5. Swing in */
        .effect-swing {
            animation: swing 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes swing {
            0% { opacity: 0; transform: rotateZ(-30deg) rotateY(60deg) translateY(-50%); transform-origin: top center; }
            100% { opacity: 1; transform: rotateZ(0deg) rotateY(0deg) translateY(0); transform-origin: top center; }
        }

        /* 6. Spin Scale */
        .effect-spin {
            animation: spin 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes spin {
            0% { opacity: 0; transform: scale(0.2) rotateZ(-180deg); }
            100% { opacity: 1; transform: scale(1) rotateZ(0deg); }
        }

        /* 7. Drop from Top */
        .effect-drop {
            animation: drop 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes drop {
            0% { opacity: 0; transform: translateY(-150%) rotateX(50deg); }
            100% { opacity: 1; transform: translateY(0) rotateX(0deg); }
        }

        /* Exit Animation (Fades out smoothly) */
        .effect-exit {
            animation: exitFade 0.6s ease forwards;
        }
        @keyframes exitFade {
            0% { opacity: 1; transform: scale(1) translateZ(0); }
            100% { opacity: 0; transform: scale(0.8) translateZ(200px); }
        }

        /* Subtle 3D Floating when image is standing still */
        .idle-float {
            animation: idleFloat 4s ease-in-out infinite alternate;
        }
        @keyframes idleFloat {
            0% { transform: translateY(0px) rotateX(2deg) rotateY(-2deg); }
            100% { transform: translateY(-10px) rotateX(-2deg) rotateY(2deg); }
        }

        /* Progress dots at bottom */
        .progress-container {
            position: absolute;
            bottom: 30px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.4s ease;
        }
        .dot.active {
            background: #3b82f6;
            box-shadow: 0 0 10px #3b82f6;
            width: 24px;
            border-radius: 4px;
        }

        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #3b82f6;
            font-size: 18px;
            font-weight: 600;
            z-index: 20;
        }

    </style>
</head>
<body>

    <div class="header">
        <h1>Project Showcases</h1>
        <p id="subtitle">Loading Gallery...</p>
    </div>

    <div id="loader">Fetching Images...</div>

    <div class="scene">
        <div id="stage"></div>
        <div class="progress-container" id="progress"></div>
    </div>

    <script>
        // List of random 3D effects
        const effectsList = [
            'effect-zoom-in',
            'effect-flip-left',
            'effect-flip-right',
            'effect-rise',
            'effect-swing',
            'effect-spin',
            'effect-drop'
        ];

        let images = [];
        let currentIndex = 0;
        let slideInterval = null;
        
        const SLIDE_TIME = 3500; // Time each image stays (3.5 seconds)
        const EXIT_TIME = 600;   // Time it takes to fade out

        // Function to shuffle array randomly
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Create dots indicator
        function buildDots(total) {
            const progress = document.getElementById('progress');
            progress.innerHTML = '';
            for (let i = 0; i < total; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot' + (i === 0 ? ' active' : '');
                progress.appendChild(dot);
            }
        }

        // Update active dot
        function updateDots(index) {
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });
        }

        // Main function to show 1 image at a time
        function showNextImage() {
            const stage = document.getElementById('stage');
            const oldCard = stage.querySelector('.tv-card');
            
            // Pick a random effect from the list
            const randomEffect = effectsList[Math.floor(Math.random() * effectsList.length)];
            const item = images[currentIndex];

            // 1. Create the new card
            const newCard = document.createElement('div');
            newCard.className = `tv-card ${randomEffect}`;
            newCard.innerHTML = `<img src="${item.url}" alt="Showcase Image">`;
            stage.appendChild(newCard);

            // 2. Remove the old card with exit animation
            if (oldCard) {
                oldCard.className = 'tv-card effect-exit'; // Remove entry effects, add exit
                setTimeout(() => {
                    if (oldCard.parentNode) {
                        oldCard.parentNode.removeChild(oldCard);
                    }
                }, EXIT_TIME);
            }

            // 3. After entry animation finishes, add the subtle float effect
            setTimeout(() => {
                // Only apply if it hasn't been removed yet
                if (newCard.parentNode) {
                    newCard.className = 'tv-card idle-float';
                    newCard.style.opacity = '1'; // Ensure it stays visible
                }
            }, 1200); // slightly longer than the entry animation

            // 4. Update dots
            updateDots(currentIndex);

            // 5. Move to next index
            currentIndex = (currentIndex + 1) % images.length;
        }

        // Load data from API
        async function loadImages() {
            try {
                const response = await fetch('/api/list');
                const contentType = response.headers.get("content-type");
                
                if (!contentType || !contentType.includes("application/json")) {
                    throw new Error("Server did not return JSON.");
                }

                const data = await response.json();
                const loader = document.getElementById('loader');
                const subtitle = document.getElementById('subtitle');

                loader.style.display = 'none';

                if (data.length === 0) {
                    subtitle.innerText = "No images found.";
                    return;
                }

                // Shuffle images so they appear randomly every time page reloads
                images = shuffle(data);
                subtitle.innerText = `Cinematic 1-by-1 Showcase (${images.length} Images)`;

                buildDots(images.length);

                // Show first image immediately
                showNextImage();

                // Start the interval for next images
                slideInterval = setInterval(showNextImage, SLIDE_TIME);

            } catch (error) {
                document.getElementById('loader').innerHTML = `<span style="color:#ef4444;">Error: ${error.message}</span>`;
            }
        }

        window.onload = loadImages;
    </script>
</body>
</html>
