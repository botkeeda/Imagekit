<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: #0f172a; 
            color: #fff;
            min-height: 100vh; 
            padding: 30px 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            font-weight: 500;
            margin-bottom: 30px;
            color: #e2e8f0;
            letter-spacing: 1px;
            text-align: center;
        }

        /* Gallery Grid */
        .gallery-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); /* 3 columns per line */
            gap: 20px; 
            width: 100%;
            max-width: 1000px;
        }

        .image-card { 
            background: #1e293b; 
            border: 1px solid #334155; 
            border-radius: 12px; 
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Hover Animation */
        .image-card:hover { 
            transform: translateY(-5px) scale(1.02); 
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
            border-color: #3b82f6;
        }

        .image-card img { 
            width: 100%; 
            height: 220px; 
            object-fit: cover; 
            display: block;
        }

        /* Loading State */
        #loader {
            color: #94a3b8;
            font-size: 16px;
            margin-top: 50px;
        }

        /* Responsive Design */
        @media (max-width: 900px) { 
            .gallery-grid { grid-template-columns: repeat(2, 1fr); } 
            .image-card img { height: 180px; }
        }
        @media (max-width: 500px) { 
            .gallery-grid { grid-template-columns: 1fr; } 
            .image-card img { height: 250px; }
            h2 { font-size: 20px; }
        }
    </style>
</head>
<body>

    <h2>My Image Gallery</h2>

    <!-- Loader text -->
    <div id="loader">Loading images...</div>

    <!-- Gallery Section -->
    <div class="gallery-grid" id="galleryGrid"></div>

    <script>
        // Server se images fetch karne ka function
        async function loadImages() {
            try {
                const response = await fetch('/api/list');
                
                // Check karein ke response JSON hai
                const contentType = response.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    throw new Error("Server ne JSON nahi bheja.");
                }

                const data = await response.json();
                const grid = document.getElementById('galleryGrid');
                const loader = document.getElementById('loader');

                loader.style.display = 'none'; // Loader hata dein

                if (data.length === 0) {
                    grid.innerHTML = '<p style="color:#94a3b8; width:100%; text-align:center; grid-column: 1/-1;">No images found.</p>';
                    return;
                }

                // Har image ke liye card banayein
                data.forEach((item) => {
                    const card = document.createElement('div');
                    card.className = 'image-card';
                    
                    card.innerHTML = `
                        <img src="${item.url}" alt="Gallery Image" loading="lazy">
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                document.getElementById('loader').innerHTML = `<span style="color:red;">Error: ${error.message}</span>`;
            }
        }

        // Page load hote hi images load karein
        window.onload = function() {
            loadImages();
        };
    </script>
</body>
</html>
