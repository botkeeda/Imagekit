<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Project Showcase</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: #09090b;
            color: #fff;
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-top: 40px;
            z-index: 10;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .header p {
            font-size: 16px;
            color: #a1a1aa;
            font-weight: 400;
        }

        .live-badge {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #e2e8f0;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #3b82f6;
            border-radius: 50%;
            box-shadow: 0 0 10px #3b82f6;
        }

        .scene {
            width: 100%;
            height: 60vh;
            margin-top: 50px;
            perspective: 1200px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .carousel {
            width: 200px;
            height: 280px;
            position: relative;
            transform-style: preserve-3d;
            animation: rotate360 30s infinite linear;
            transform: rotateX(-10deg);
        }

        .scene:hover .carousel {
            animation-play-state: paused;
        }

        .carousel-card {
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: #18181b;
            transition: border-color 0.3s;
        }

        .carousel-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
            transition: opacity 0.3s, transform 0.3s;
        }

        .carousel-card:hover {
            border-color: #3b82f6;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.5);
        }

        .carousel-card:hover img {
            opacity: 1;
            transform: scale(1.05);
        }

        @keyframes rotate360 {
            from { transform: rotateX(-10deg) rotateY(0deg); }
            to { transform: rotateX(-10deg) rotateY(-360deg); }
        }

        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #3b82f6;
            font-size: 18px;
            font-weight: 600;
            z-index: 20;
        }

    </style>
</head>
<body>

    <div class="header">
        <h1>Project Showcases</h1>
        <p id="subtitle">Loading Gallery...</p>
    </div>

    <div id="loader">Fetching Images...</div>

    <div class="scene">
        <div class="carousel" id="carousel">
        </div>
    </div>

    <div class="live-badge">
        <div class="live-dot"></div>
        LIVE
    </div>

    <script>
        async function loadImages() {
            try {
                const response = await fetch('/api/list');
                
                const contentType = response.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    throw new Error("Server did not return JSON.");
                }

                const data = await response.json();
                const carousel = document.getElementById('carousel');
                const loader = document.getElementById('loader');
                const subtitle = document.getElementById('subtitle');

                loader.style.display = 'none';

                if (data.length === 0) {
                    subtitle.innerText = "No images found.";
                    return;
                }

                subtitle.innerText = `Rotating 3D Preview (${data.length} Images)`;

                const totalItems = data.length;
                const cardWidth = 200;
                
                let radius = (cardWidth / 2) / Math.tan(Math.PI / totalItems);
                if (totalItems < 4) radius = 300;

                const angleStep = 360 / totalItems;

                data.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = 'carousel-card';
                    
                    const angle = index * angleStep;
                    card.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;

                    card.innerHTML = `
                        <img src="${item.url}" alt="Image" loading="lazy">
                    `;
                    carousel.appendChild(card);
                });

            } catch (error) {
                document.getElementById('loader').innerHTML = `<span style="color:#ef4444;">Error: ${error.message}</span>`;
            }
        }

        window.onload = function() {
            loadImages();
        };
    </script>
</body>
</html>
