<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImageKit Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: #0f172a; 
            color: #fff;
            min-height: 100vh; 
            padding: 20px 15px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Login Screen */
        .login-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 35px 25px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        .login-box h2 { margin-bottom: 20px; font-size: 20px; }
        .login-box input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #3b82f6;
            border-radius: 8px;
            color: #fff;
            font-size: 18px;
            text-align: center;
            letter-spacing: 8px;
            margin-bottom: 15px;
            outline: none;
        }
        .login-box input::placeholder { letter-spacing: normal; font-size: 14px; }
        .login-box button { width: 100%; padding: 12px; font-size: 15px; }
        .login-error { color: #ef4444; font-size: 13px; margin-top: 10px; min-height: 18px; }

        /* Main app hidden until login */
        #mainApp { display: none; width: 100%; flex-direction: column; align-items: center; }

        /* Control Panel */
        .control-panel { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(10px);
            padding: 20px; 
            border-radius: 15px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 900px;
            text-align: center;
            margin-bottom: 30px;
        }

        input[type="file"] {
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px dashed #3b82f6;
            border-radius: 8px;
            color: #fff;
            width: 100%;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        
        button { 
            background: #3b82f6;
            color: white; 
            border: none; 
            padding: 10px 20px; 
            cursor: pointer; 
            border-radius: 8px; 
            font-size: 14px; 
            font-weight: 500;
            transition: 0.3s;
        }
        button:hover { background: #2563eb; transform: translateY(-2px); }
        .btn-secondary { background: #10b981; }
        .btn-secondary:hover { background: #059669; }
        .btn-warning { background: #f59e0b; }
        .btn-warning:hover { background: #d97706; }

        #status { margin-top: 15px; font-size: 14px; font-weight: bold; }
        .success { color: #10b981; }
        .error { color: #ef4444; }

        /* --- GRID LAYOUT --- */
        .gallery-section {
            width: 100%;
            max-width: 900px;
            display: none;
        }

        .gallery-title { 
            font-size: 18px; 
            font-weight: 600; 
            margin-bottom: 15px;
            color: #e2e8f0;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
        }

        .gallery-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr);
            gap: 15px; 
        }

        .image-card { 
            background: #1e293b; 
            border: 1px solid #334155; 
            border-radius: 12px; 
            padding: 10px; 
            cursor: pointer;
            transition: 0.3s;
            position: relative;
        }
        .image-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border-color: #3b82f6;
        }

        .image-card img { 
            width: 100%; 
            height: 150px; 
            object-fit: cover; 
            border-radius: 8px; 
            display: block;
        }

        .delete-btn { 
            position: absolute; 
            top: 5px; 
            right: 5px; 
            background: #ef4444; 
            color: white; 
            border: none; 
            border-radius: 50%; 
            width: 28px; 
            height: 28px; 
            font-size: 14px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 0; 
            z-index: 10;
        }
        .delete-btn:hover { background: #dc2626; transform: scale(1.1); }

        /* --- MODAL --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            border: 1px solid #334155;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .modal-content img {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 15px;
            background: #0f172a;
        }

        .url-input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #3b82f6;
            border-radius: 8px;
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 15px;
            outline: none;
            word-break: break-all;
        }

        .modal-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .btn-close { background: #475569; }
        .btn-close:hover { background: #334155; }

        /* Change Password Modal */
        .pwd-input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #3b82f6;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            margin-bottom: 12px;
            outline: none;
            text-align: center;
            letter-spacing: 4px;
        }
        .pwd-input::placeholder { letter-spacing: normal; font-size: 13px; }

        /* Responsive */
        @media (max-width: 768px) { 
            .gallery-grid { grid-template-columns: repeat(2, 1fr); } 
        }
        @media (max-width: 480px) { 
            .gallery-grid { grid-template-columns: 1fr; } 
            .image-card img { height: 200px; }
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h2>🔒 Enter Password</h2>
            <input type="password" id="loginPassword" maxlength="4" inputmode="numeric" placeholder="4-digit password" autocomplete="off">
            <button onclick="verifyLogin()">Login</button>
            <div class="login-error" id="loginError"></div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="mainApp">
        <div class="control-panel">
            <h2 style="margin-bottom: 20px;">📸 My ImageKit Gallery</h2>
            <input type="file" id="fileInput" accept="image/*">
            <div class="btn-group">
                <button onclick="uploadImage()">☁️ Upload Image</button>
                <button class="btn-secondary" onclick="loadGallery()">🔄 Load Images</button>
                <button class="btn-warning" onclick="openChangePwdModal()">🔑 Change Password</button>
            </div>
            <div id="status"></div>
        </div>

        <div class="gallery-section" id="gallerySection">
            <div class="gallery-title">Gallery</div>
            <div class="gallery-grid" id="galleryGrid"></div>
        </div>
    </div>

    <!-- Image URL Modal -->
    <div class="modal" id="urlModal">
        <div class="modal-content">
            <img id="modalImage" src="" alt="Preview">
            <h3 style="margin-bottom: 10px; font-size: 16px;">Image URL</h3>
            <input type="text" id="modalUrlInput" class="url-input" readonly>
            <div class="modal-btns">
                <button onclick="copyModalUrl()">📋 Copy URL</button>
                <button class="btn-close" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- Change Password Modal -->
    <div class="modal" id="pwdModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 20px; font-size: 18px;">🔑 Change Password</h3>
            <input type="password" id="oldPwd" class="pwd-input" maxlength="4" inputmode="numeric" placeholder="Old password">
            <input type="password" id="newPwd" class="pwd-input" maxlength="4" inputmode="numeric" placeholder="New 4-digit password">
            <input type="password" id="confirmPwd" class="pwd-input" maxlength="4" inputmode="numeric" placeholder="Confirm new password">
            <div class="login-error" id="pwdError"></div>
            <div class="modal-btns" style="margin-top: 10px;">
                <button onclick="changePassword()">✅ Update</button>
                <button class="btn-close" onclick="closePwdModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // ---------- LOGIN / PASSWORD ----------
        let currentPassword = null;

        async function fetchPassword() {
            try {
                // Yahan /api/password use kiya hai (bina .json ke)
                const res = await fetch('/api/password?t=' + Date.now(), { cache: 'no-store' });
                if (!res.ok) throw new Error('Password API not found');
                const data = await res.json();
                return String(data.password);
            } catch (e) {
                console.error('Password load error:', e);
                return null;
            }
        }

        async function verifyLogin() {
            const input = document.getElementById('loginPassword').value.trim();
            const errDiv = document.getElementById('loginError');
            errDiv.textContent = '';

            if (input.length !== 4 || !/^\d{4}$/.test(input)) {
                errDiv.textContent = 'Please enter a valid 4-digit password';
                return;
            }

            errDiv.textContent = '⏳ Verifying...';
            const stored = await fetchPassword();

            if (stored === null) {
                errDiv.textContent = '❌ Could not load password. Check api/password.js';
                return;
            }

            if (input === stored) {
                currentPassword = stored;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'flex';
                loadGallery();
            } else {
                errDiv.textContent = '❌ Wrong password';
                document.getElementById('loginPassword').value = '';
            }
        }

        // Enter key on login
        document.getElementById('loginPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') verifyLogin();
        });

        // ---------- CHANGE PASSWORD ----------
        function openChangePwdModal() {
            document.getElementById('oldPwd').value = '';
            document.getElementById('newPwd').value = '';
            document.getElementById('confirmPwd').value = '';
            document.getElementById('pwdError').textContent = '';
            document.getElementById('pwdModal').style.display = 'flex';
        }

        function closePwdModal() {
            document.getElementById('pwdModal').style.display = 'none';
        }

        async function changePassword() {
            const oldPwd = document.getElementById('oldPwd').value.trim();
            const newPwd = document.getElementById('newPwd').value.trim();
            const confirmPwd = document.getElementById('confirmPwd').value.trim();
            const errDiv = document.getElementById('pwdError');
            errDiv.textContent = '';

            if (oldPwd !== currentPassword) {
                errDiv.textContent = '❌ Old password is incorrect';
                return;
            }
            if (!/^\d{4}$/.test(newPwd)) {
                errDiv.textContent = '❌ New password must be 4 digits';
                return;
            }
            if (newPwd !== confirmPwd) {
                errDiv.textContent = '❌ Passwords do not match';
                return;
            }

            errDiv.textContent = '⏳ Updating...';

            try {
                const res = await fetch('/api/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ oldPassword: oldPwd, newPassword: newPwd })
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error || 'Failed to update password');
                }

                currentPassword = newPwd;
                errDiv.style.color = '#10b981';
                errDiv.textContent = '✅ Password updated!';
                setTimeout(() => {
                    closePwdModal();
                    errDiv.style.color = '#ef4444';
                }, 1200);
            } catch (e) {
                errDiv.textContent = '❌ ' + e.message;
            }
        }

        // ---------- EXISTING GALLERY LOGIC ----------
        async function handleResponse(response) {
            const contentType = response.headers.get("content-type");
            if (contentType && contentType.includes("application/json")) {
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || `HTTP Error: ${response.status}`);
                return data;
            } else {
                throw new Error("Server error. Please check Vercel logs.");
            }
        }

        async function uploadImage() {
            const fileInput = document.getElementById('fileInput');
            const statusDiv = document.getElementById('status');
            if (fileInput.files.length === 0) {
                statusDiv.innerHTML = '<span class="error">Select an image first!</span>';
                return;
            }
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);
            formData.append('fileName', file.name);

            statusDiv.innerHTML = '⏳ Uploading...';
            statusDiv.className = '';

            try {
                const response = await fetch('/api/upload', { method: 'POST', body: formData });
                await handleResponse(response);
                statusDiv.innerHTML = '✅ Image Uploaded Successfully!';
                statusDiv.className = 'success';
                fileInput.value = "";
                loadGallery(); 
            } catch (error) {
                statusDiv.innerHTML = `❌ Error: ${error.message}`;
                statusDiv.className = 'error';
            }
        }

        async function loadGallery() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '⏳ Loading images...';
            statusDiv.className = '';

            try {
                const response = await fetch('/api/list');
                const data = await handleResponse(response);
                
                statusDiv.innerHTML = `✅ ${data.length} Images Loaded!`;
                statusDiv.className = 'success';
                renderGrid(data);
            } catch (error) {
                statusDiv.innerHTML = `❌ Error: ${error.message}`;
                statusDiv.className = 'error';
            }
        }

        function renderGrid(images) {
            const grid = document.getElementById('galleryGrid');
            const section = document.getElementById('gallerySection');
            grid.innerHTML = "";

            if (images.length === 0) {
                section.style.display = 'none';
                return;
            }
            
            section.style.display = 'block';

            images.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'image-card';
                card.onclick = () => openModal(item.url);

                card.innerHTML = `
                    <button class="delete-btn" onclick="event.stopPropagation(); deleteImage('${item.fileId}')">✕</button>
                    <img src="${item.url}" alt="Image" loading="lazy">
                `;
                grid.appendChild(card);
            });
        }

        function openModal(url) {
            document.getElementById('modalImage').src = url;
            document.getElementById('modalUrlInput').value = url;
            document.getElementById('urlModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('urlModal').style.display = 'none';
        }

        function copyModalUrl() {
            const urlInput = document.getElementById('modalUrlInput');
            urlInput.select();
            navigator.clipboard.writeText(urlInput.value).then(() => {
                const statusDiv = document.getElementById('status');
                statusDiv.innerHTML = '📋 URL Copied!';
                statusDiv.className = 'success';
                closeModal();
                setTimeout(() => { statusDiv.innerHTML = ''; }, 2000);
            });
        }

        async function deleteImage(fileId) {
            if(!confirm("Delete this image permanently from ImageKit?")) return;
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '⏳ Deleting...';
            
            try {
                const response = await fetch(`/api/delete?fileId=${fileId}`, { method: 'DELETE' });
                await handleResponse(response);
                statusDiv.innerHTML = '✅ Image Deleted!';
                statusDiv.className = 'success';
                loadGallery(); 
            } catch (error) {
                statusDiv.innerHTML = `❌ Delete Error: ${error.message}`;
                statusDiv.className = 'error';
            }
        }

        window.onclick = function(event) {
            const modal = document.getElementById('urlModal');
            const pwdModal = document.getElementById('pwdModal');
            if (event.target === modal) closeModal();
            if (event.target === pwdModal) closePwdModal();
        }
    </script>
</body>
</html>
