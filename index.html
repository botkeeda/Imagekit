<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImageKit Professional Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            min-height: 100vh; 
            padding: 30px 15px; 
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); 
            width: 100%;
            max-width: 1200px; /* Zyada wide screen support */
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        h2 { 
            color: #2c3e50; 
            margin-bottom: 20px; 
            font-weight: 600;
            text-align: center;
            font-size: 24px;
            letter-spacing: 0.5px;
        }

        /* File Input Styling */
        .file-upload-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        input[type="file"] {
            padding: 10px;
            background: #fff;
            border: 2px dashed #007bff;
            border-radius: 10px;
            color: #555;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
            transition: 0.3s;
        }
        input[type="file"]:hover { border-color: #0056b3; background: #f8fbff; }

        /* Buttons */
        .btn-group { 
            display: flex; 
            gap: 15px; 
            justify-content: center; 
            margin-bottom: 25px; 
            flex-wrap: wrap; 
        }
        
        button { 
            background: linear-gradient(to right, #007bff, #0056b3);
            color: white; 
            border: none; 
            padding: 12px 28px; 
            cursor: pointer; 
            border-radius: 8px; 
            font-size: 15px; 
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.4);
        }
        
        .btn-secondary { 
            background: linear-gradient(to right, #28a745, #218838);
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
        }
        .btn-secondary:hover {
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4);
        }

        /* Status Message */
        #status { 
            margin: 15px 0; 
            font-weight: 500; 
            text-align: center; 
            font-size: 15px;
            padding: 10px;
            border-radius: 8px;
        }
        .success { color: #155724; background-color: #d4edda; border: 1px solid #c3e6cb; }
        .error { color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; }

        /* Gallery Header */
        .gallery-title { 
            margin-top: 30px; 
            font-size: 18px; 
            font-weight: 600; 
            color: #333;
            border-bottom: 2px solid #ddd; 
            padding-bottom: 10px; 
            text-align: left; 
        }

        /* 6-Column Grid System */
        .gallery-container { 
            display: grid; 
            grid-template-columns: repeat(6, 1fr); /* 6 boxes per line */
            gap: 15px; 
            margin-top: 20px; 
        }

        /* Image Card */
        .image-card { 
            background: #fff; 
            border: 1px solid #eee; 
            border-radius: 12px; 
            padding: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            position: relative; 
            transition: 0.3s;
        }
        .image-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .image-card img { 
            width: 100%; 
            height: 90px; 
            object-fit: cover; 
            border-radius: 8px; 
            border: 1px solid #f0f0f0;
        }

        /* URL Box */
        .url-box { 
            width: 100%; 
            font-size: 10px; 
            color: #555; 
            margin-top: 10px; 
            padding: 6px; 
            border: 1px solid #ddd; 
            border-radius: 6px; 
            background: #f8f9fa; 
            cursor: pointer; 
            text-align: left; 
            word-break: break-all; 
            height: 45px; 
            overflow-y: auto; 
            transition: 0.2s;
        }
        .url-box:hover { 
            background: #eef5ff; 
            border-color: #007bff; 
            color: #007bff;
        }

        /* Delete Button */
        .delete-btn { 
            position: absolute; 
            top: -8px; 
            right: -8px; 
            background: #ff4757; 
            color: white; 
            border: 2px solid white; 
            border-radius: 50%; 
            width: 24px; 
            height: 24px; 
            font-size: 12px; 
            font-weight: bold;
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 0; 
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .delete-btn:hover { background: #ff6b81; transform: scale(1.1); }

        /* Responsive Design */
        @media (max-width: 1024px) { .gallery-container { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 768px) { .gallery-container { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 480px) { 
            .gallery-container { grid-template-columns: repeat(2, 1fr); } 
            .image-card img { height: 100px; }
            .container { padding: 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📸 My ImageKit Gallery</h2>
        
        <div class="file-upload-wrapper">
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="btn-group">
            <button onclick="uploadImage()">☁️ Upload Image</button>
            <button class="btn-secondary" onclick="loadAllImages()">🔄 Load All Images</button>
        </div>

        <div id="status"></div>

        <div id="gallerySection" style="display: none;">
            <div class="gallery-title">Gallery (Tap link to copy)</div>
            <div class="gallery-container" id="galleryContainer"></div>
        </div>
    </div>

    <script>
        async function handleResponse(response) {
            const contentType = response.headers.get("content-type");
            if (contentType && contentType.includes("application/json")) {
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || `HTTP Error: ${response.status}`);
                return data;
            } else {
                const text = await response.text();
                throw new Error(`Server Error: ${text.substring(0, 50)}... (Vercel Logs check karein)`);
            }
        }

        async function uploadImage() {
            const fileInput = document.getElementById('fileInput');
            const statusDiv = document.getElementById('status');
            if (fileInput.files.length === 0) {
                statusDiv.innerHTML = '<span class="error">Pehle koi image select karein!</span>';
                return;
            }
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);
            formData.append('fileName', file.name);

            statusDiv.innerHTML = '⏳ Uploading...';
            statusDiv.className = '';

            try {
                const response = await fetch('/api/upload', { method: 'POST', body: formData });
                await handleResponse(response);
                statusDiv.innerHTML = '✅ Image Upload Ho Gayi!';
                statusDiv.className = 'success';
                fileInput.value = "";
                loadAllImages(); 
            } catch (error) {
                statusDiv.innerHTML = `❌ Error: ${error.message}`;
                statusDiv.className = 'error';
            }
        }

        async function loadAllImages() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '⏳ Fetching all images...';
            statusDiv.className = '';
            try {
                const response = await fetch('/api/list');
                const data = await handleResponse(response);
                statusDiv.innerHTML = `✅ ${data.length} Images Load Ho Gayi!`;
                statusDiv.className = 'success';
                renderGallery(data);
            } catch (error) {
                statusDiv.innerHTML = `❌ Error: ${error.message}`;
                statusDiv.className = 'error';
            }
        }

        function renderGallery(images) {
            const container = document.getElementById('galleryContainer');
            const gallerySection = document.getElementById('gallerySection');
            container.innerHTML = "";
            if (images.length === 0) {
                gallerySection.style.display = 'none';
                return;
            }
            gallerySection.style.display = 'block';
            images.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'image-card';
                card.innerHTML = `
                    <button class="delete-btn" onclick="deleteImage('${item.fileId}')">✕</button>
                    <img src="${item.url}" alt="Image" loading="lazy">
                    <div class="url-box" onclick="copyUrl('${item.url}')" title="Click to copy link">${item.url}</div>
                `;
                container.appendChild(card);
            });
        }

        async function deleteImage(fileId) {
            if(!confirm("Kya aap sach mein yeh image delete karna chahte hain?")) return;
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '⏳ Deleting...';
            statusDiv.className = '';
            try {
                const response = await fetch(`/api/delete?fileId=${fileId}`, { method: 'DELETE' });
                await handleResponse(response);
                statusDiv.innerHTML = '✅ Image Delete Ho Gayi!';
                statusDiv.className = 'success';
                loadAllImages(); 
            } catch (error) {
                statusDiv.innerHTML = `❌ Delete Error: ${error.message}`;
                statusDiv.className = 'error';
            }
        }

        function copyUrl(url) {
            navigator.clipboard.writeText(url).then(() => {
                const statusDiv = document.getElementById('status');
                statusDiv.innerHTML = '📋 URL Copy Ho Gaya!';
                statusDiv.className = 'success';
                setTimeout(() => { 
                    statusDiv.innerHTML = ''; 
                    statusDiv.className = '';
                }, 2000);
            }).catch(err => {
                alert("Copy nahi ho paya.");
            });
        }
    </script>
</body>
</html>
