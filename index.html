<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImageKit 3D Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: #0f172a; /* Dark professional theme */
            color: #fff;
            min-height: 100vh; 
            padding: 20px 15px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Control Panel (Upload/Delete) */
        .control-panel { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(10px);
            padding: 20px; 
            border-radius: 15px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
            margin-bottom: 30px;
            z-index: 10;
        }

        input[type="file"] {
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px dashed #3b82f6;
            border-radius: 8px;
            color: #fff;
            width: 100%;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        
        button { 
            background: #3b82f6;
            color: white; 
            border: none; 
            padding: 10px 20px; 
            cursor: pointer; 
            border-radius: 8px; 
            font-size: 14px; 
            font-weight: 500;
            transition: 0.3s;
        }
        button:hover { background: #2563eb; transform: translateY(-2px); }
        .btn-secondary { background: #10b981; }
        .btn-secondary:hover { background: #059669; }
        .btn-purple { background: #8b5cf6; }
        .btn-purple:hover { background: #7c3aed; }

        #status { margin-top: 15px; font-size: 14px; font-weight: bold; }
        .success { color: #10b981; }
        .error { color: #ef4444; }

        /* --- 3D CAROUSEL CSS --- */
        .scene {
            width: 100%;
            height: 400px;
            perspective: 1200px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: visible;
            margin-top: 20px;
        }

        .carousel {
            width: 200px;
            height: 250px;
            position: absolute;
            transform-style: preserve-3d;
            animation: rotate360 25s infinite linear; /* Ghoomne ki speed */
            transform: rotateY(0deg);
        }

        /* Jab mouse upar ho toh ghoomna ruk jaye */
        .scene:hover .carousel {
            animation-play-state: paused;
        }

        .carousel-card {
            position: absolute;
            width: 200px;
            height: 250px;
            left: 0;
            top: 0;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            border: 3px solid rgba(255, 255, 255, 0.1);
            backface-visibility: visible;
            transition: border-color 0.3s;
        }

        .carousel-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .carousel-card:hover {
            border-color: #3b82f6;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.6);
        }

        /* 3D Rotation Animation */
        @keyframes rotate360 {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(-360deg); }
        }

        /* Text below carousel */
        .gallery-hint {
            margin-top: 20px;
            color: #94a3b8;
            font-size: 14px;
            text-align: center;
            z-index: 10;
        }

    </style>
</head>
<body>

    <!-- Control Panel -->
    <div class="control-panel">
        <input type="file" id="fileInput" accept="image/*">
        <div class="btn-group">
            <button onclick="uploadImage()">Upload Image</button>
            <button class="btn-secondary" onclick="loadCarousel()">Refresh Gallery</button>
        </div>
        <div id="status"></div>
    </div>

    <!-- 3D Carousel Section -->
    <div class="scene" id="scene" style="display: none;">
        <div class="carousel" id="carousel">
            <!-- Images will be injected here via JS -->
        </div>
    </div>
    
    <div class="gallery-hint" id="hintText" style="display: none;">
        3D Gallery • Hover to Pause • Swipe/Scroll on mobile
    </div>

    <script>
        let carouselItems = [];
        let isAnimating = true;

        async function handleResponse(response) {
            const contentType = response.headers.get("content-type");
            if (contentType && contentType.includes("application/json")) {
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || `HTTP Error: ${response.status}`);
                return data;
            } else {
                throw new Error("Server error. Check Vercel logs.");
            }
        }

        async function uploadImage() {
            const fileInput = document.getElementById('fileInput');
            const statusDiv = document.getElementById('status');
            if (fileInput.files.length === 0) {
                statusDiv.innerHTML = '<span class="error">Select an image first!</span>';
                return;
            }
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);
            formData.append('fileName', file.name);

            statusDiv.innerHTML = 'Uploading...';
            statusDiv.className = '';

            try {
                const response = await fetch('/api/upload', { method: 'POST', body: formData });
                await handleResponse(response);
                statusDiv.innerHTML = '✅ Uploaded successfully!';
                statusDiv.className = 'success';
                fileInput.value = "";
                loadCarousel(); // Refresh carousel after upload
            } catch (error) {
                statusDiv.innerHTML = `❌ Error: ${error.message}`;
                statusDiv.className = 'error';
            }
        }

        async function loadCarousel() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '⏳ Loading 3D Gallery...';
            statusDiv.className = '';

            try {
                const response = await fetch('/api/list');
                const data = await handleResponse(response);
                
                if(data.length === 0) {
                    statusDiv.innerHTML = 'No images found in ImageKit.';
                    return;
                }

                statusDiv.innerHTML = '';
                render3DCarousel(data);
            } catch (error) {
                statusDiv.innerHTML = `❌ Error: ${error.message}`;
                statusDiv.className = 'error';
            }
        }

        function render3DCarousel(images) {
            const carousel = document.getElementById('carousel');
            const scene = document.getElementById('scene');
            const hintText = document.getElementById('hintText');
            
            carousel.innerHTML = ""; // Clear existing
            scene.style.display = 'flex';
            hintText.style.display = 'block';

            const totalItems = images.length;
            // Agar images kam hain toh radius chota rakhein
            const radius = totalItems > 4 ? 350 : (totalItems * 80); 

            images.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'carousel-card';
                
                // Calculate angle for each image
                const angle = (360 / totalItems) * index;
                // Push image outwards by radius
                card.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;

                card.innerHTML = `
                    <img src="${item.url}" alt="Image" loading="lazy">
                `;
                carousel.appendChild(card);
            });

            // Adjust animation speed based on number of images
            const speed = Math.max(15, totalItems * 3); 
            carousel.style.animation = `rotate360 ${speed}s infinite linear`;
        }

        // Load images when page starts
        window.onload = function() {
            loadCarousel();
        };
    </script>
</body>
</html>
