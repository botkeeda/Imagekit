<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImageKit Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: #0f172a; 
            color: #fff;
            min-height: 100vh; 
            padding: 20px 15px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Control Panel */
        .control-panel { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(10px);
            padding: 20px; 
            border-radius: 15px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 900px;
            text-align: center;
            margin-bottom: 30px;
        }

        input[type="file"] {
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px dashed #3b82f6;
            border-radius: 8px;
            color: #fff;
            width: 100%;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        
        button { 
            background: #3b82f6;
            color: white; 
            border: none; 
            padding: 10px 20px; 
            cursor: pointer; 
            border-radius: 8px; 
            font-size: 14px; 
            font-weight: 500;
            transition: 0.3s;
        }
        button:hover { background: #2563eb; transform: translateY(-2px); }
        .btn-secondary { background: #10b981; }
        .btn-secondary:hover { background: #059669; }

        #status { margin-top: 15px; font-size: 14px; font-weight: bold; }
        .success { color: #10b981; }
        .error { color: #ef4444; }

        /* --- GRID LAYOUT --- */
        .gallery-section {
            width: 100%;
            max-width: 900px;
            display: none;
        }

        .gallery-title { 
            font-size: 18px; 
            font-weight: 600; 
            margin-bottom: 15px;
            color: #e2e8f0;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
        }

        .gallery-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); /* 3 Columns */
            gap: 15px; 
        }

        .image-card { 
            background: #1e293b; 
            border: 1px solid #334155; 
            border-radius: 12px; 
            padding: 10px; 
            cursor: pointer;
            transition: 0.3s;
            position: relative;
        }
        .image-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border-color: #3b82f6;
        }

        .image-card img { 
            width: 100%; 
            height: 150px; 
            object-fit: cover; 
            border-radius: 8px; 
            display: block;
        }

        .delete-btn { 
            position: absolute; 
            top: 5px; 
            right: 5px; 
            background: #ef4444; 
            color: white; 
            border: none; 
            border-radius: 50%; 
            width: 28px; 
            height: 28px; 
            font-size: 14px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 0; 
            z-index: 10;
        }
        .delete-btn:hover { background: #dc2626; transform: scale(1.1); }

        /* --- MODAL (Popup for URL) --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            border: 1px solid #334155;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .modal-content img {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 15px;
            background: #0f172a;
        }

        .url-input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #3b82f6;
            border-radius: 8px;
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 15px;
            outline: none;
            word-break: break-all;
        }

        .modal-btns { display: flex; gap: 10px; justify-content: center; }
        .btn-close { background: #475569; }
        .btn-close:hover { background: #334155; }

        /* Responsive */
        @media (max-width: 768px) { 
            .gallery-grid { grid-template-columns: repeat(2, 1fr); } 
        }
        @media (max-width: 480px) { 
            .gallery-grid { grid-template-columns: 1fr; } 
            .image-card img { height: 200px; }
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <h2 style="margin-bottom: 20px;">📸 My ImageKit Gallery</h2>
        <input type="file" id="fileInput" accept="image/*">
        <div class="btn-group">
            <button onclick="uploadImage()">☁️ Upload Image</button>
            <button class="btn-secondary" onclick="loadGallery()">🔄 Load Images</button>
        </div>
        <div id="status"></div>
    </div>

    <div class="gallery-section" id="gallerySection">
        <div class="gallery-title">Gallery</div>
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <!-- Modal (Popup) -->
    <div class="modal" id="urlModal">
        <div class="modal-content">
            <img id="modalImage" src="" alt="Preview">
            <h3 style="margin-bottom: 10px; font-size: 16px;">Image URL</h3>
            <input type="text" id="modalUrlInput" class="url-input" readonly>
            <div class="modal-btns">
                <button onclick="copyModalUrl()">📋 Copy URL</button>
                <button class="btn-close" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        async function handleResponse(response) {
            const contentType = response.headers.get("content-type");
            if (contentType && contentType.includes("application/json")) {
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || `HTTP Error: ${response.status}`);
                return data;
            } else {
                throw new Error("Server error. Please check Vercel logs.");
            }
        }

        async function uploadImage() {
            const fileInput = document.getElementById('fileInput');
            const statusDiv = document.getElementById('status');
            if (fileInput.files.length === 0) {
                statusDiv.innerHTML = '<span class="error">Select an image first!</span>';
                return;
            }
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);
            formData.append('fileName', file.name);

            statusDiv.innerHTML = '⏳ Uploading...';
            statusDiv.className = '';

            try {
                const response = await fetch('/api/upload', { method: 'POST', body: formData });
                await handleResponse(response);
                statusDiv.innerHTML = '✅ Image Uploaded Successfully!';
                statusDiv.className = 'success';
                fileInput.value = "";
                loadGallery(); 
            } catch (error) {
                statusDiv.innerHTML = `❌ Error: ${error.message}`;
                statusDiv.className = 'error';
            }
        }

        async function loadGallery() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '⏳ Loading images...';
            statusDiv.className = '';

            try {
                const response = await fetch('/api/list');
                const data = await handleResponse(response);
                
                statusDiv.innerHTML = `✅ ${data.length} Images Loaded!`;
                statusDiv.className = 'success';
                renderGrid(data);
            } catch (error) {
                statusDiv.innerHTML = `❌ Error: ${error.message}`;
                statusDiv.className = 'error';
            }
        }

        function renderGrid(images) {
            const grid = document.getElementById('galleryGrid');
            const section = document.getElementById('gallerySection');
            grid.innerHTML = "";

            if (images.length === 0) {
                section.style.display = 'none';
                return;
            }
            
            section.style.display = 'block';

            images.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'image-card';
                
                // Image par click karne se modal khulega
                card.onclick = () => openModal(item.url);

                card.innerHTML = `
                    <button class="delete-btn" onclick="event.stopPropagation(); deleteImage('${item.fileId}')">✕</button>
                    <img src="${item.url}" alt="Image" loading="lazy">
                `;
                grid.appendChild(card);
            });
        }

        // Modal Functions
        function openModal(url) {
            document.getElementById('modalImage').src = url;
            document.getElementById('modalUrlInput').value = url;
            document.getElementById('urlModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('urlModal').style.display = 'none';
        }

        function copyModalUrl() {
            const urlInput = document.getElementById('modalUrlInput');
            urlInput.select();
            navigator.clipboard.writeText(urlInput.value).then(() => {
                const statusDiv = document.getElementById('status');
                statusDiv.innerHTML = '📋 URL Copied!';
                statusDiv.className = 'success';
                closeModal();
                setTimeout(() => { statusDiv.innerHTML = ''; }, 2000);
            });
        }

        // Delete Image
        async function deleteImage(fileId) {
            if(!confirm("Delete this image permanently from ImageKit?")) return;
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '⏳ Deleting...';
            
            try {
                const response = await fetch(`/api/delete?fileId=${fileId}`, { method: 'DELETE' });
                await handleResponse(response);
                statusDiv.innerHTML = '✅ Image Deleted!';
                statusDiv.className = 'success';
                loadGallery(); 
            } catch (error) {
                statusDiv.innerHTML = `❌ Delete Error: ${error.message}`;
                statusDiv.className = 'error';
            }
        }

        // Close modal if clicked outside
        window.onclick = function(event) {
            const modal = document.getElementById('urlModal');
            if (event.target === modal) closeModal();
        }

        // Load images on page start
        window.onload = function() {
            loadGallery();
        };
    </script>
</body>
</html>
